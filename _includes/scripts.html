<script type="module" src="{{ base_path }}/assets/js/main.min.js"></script>

{% include analytics.html %}

{% include comments-providers/scripts.html %}

<!-- === One-Click Copy Button & Reading Progress Bar === -->
<style>
  /* Hide Minimal Mistakes default </> icon */
  div.highlighter-rouge::before,
  figure.highlight::before {
    display: none !important;
  }

  div.highlighter-rouge,
  figure.highlight,
  pre {
    position: relative;
  }

  /* Copy Button (matches your original hover style) */
  .copy-code-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 10;
    padding: 4px 10px;
    font-size: 12px;
    font-family: inherit;
    font-weight: 600;
    color: #e2e8f0;
    background-color: rgba(30, 41, 59, 0.85);
    border: 1px solid rgba(148, 163, 184, 0.4);
    border-radius: 5px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s ease, background-color 0.2s ease;
  }

  div.highlighter-rouge:hover .copy-code-btn,
  figure.highlight:hover .copy-code-btn,
  pre:hover .copy-code-btn,
  .copy-code-btn:focus {
    opacity: 1;
  }

  .copy-code-btn:hover {
    background-color: #0f172a;
    color: #ffffff;
  }

  .copy-code-btn.copied {
    background-color: #16a34a;
    border-color: #16a34a;
    color: #ffffff;
    opacity: 1;
  }

  /* Smooth Reading Progress Bar at Top of Screen */
  #reading-progress-bar {
    position: fixed;
    top: 0;
    left: 0;
    width: 0%;
    height: 3px;
    background: linear-gradient(90deg, #38bdf8, #818cf8);
    z-index: 9999;
    transition: width 0.1s ease-out;
  }
</style>

<div id="reading-progress-bar"></div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const codeBlocks = document.querySelectorAll("div.highlighter-rouge, figure.highlight");

    codeBlocks.forEach(function (block) {
      const codeElement = block.querySelector("pre code") || block.querySelector("pre");
      if (!codeElement) return;

      const button = document.createElement("button");
      button.className = "copy-code-btn";
      button.type = "button";
      button.innerText = "Copy";
      button.setAttribute("aria-label", "Copy code to clipboard");

      button.addEventListener("click", function () {
        const textToCopy = codeElement.innerText;

        navigator.clipboard.writeText(textToCopy).then(function () {
          button.innerText = "Copied!";
          button.classList.add("copied");

          setTimeout(function () {
            button.innerText = "Copy";
            button.classList.remove("copied");
          }, 2000);
        });
      });

      block.appendChild(button);
    });
  });

  window.addEventListener("scroll", function () {
    const progressBar = document.getElementById("reading-progress-bar");
    if (!progressBar) return;

    const scrollTop = window.scrollY || document.documentElement.scrollTop;
    const docHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;

    if (docHeight > 0) {
      const scrollPercent = (scrollTop / docHeight) * 100;
      progressBar.style.width = scrollPercent + "%";
    }
  });
</script>
